# Inspect workers: relay-jobs worker list
# Human mode prints Status and occupied/total Slots; AGENT=1 prints JSON.
# User configuration: ~/.config/relay-jobs/relay-jobs.toml
# Paths are optional; relative values resolve from this file's directory.
# Workers default to separate relay-jobs-worker state/cache directories.

[coordinator]
worker_timeout = "1s"

[worker]
slots = 2

[retention]
logs = "168h"
workspaces = "720h"
interval = "1h"

# Replace the SSH alias and socket with the worker account's settings.
# Omit host for a local Unix socket.
[[workers]]
name = "linux"
host = "build-worker"
socket = "/home/runner/.local/state/relay-jobs-worker/worker.sock"
labels = ["linux", "amd64"]
